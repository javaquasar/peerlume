[package]
name = "peerlume"
version = "0.1.0"
edition = "2024"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:rfd", "dep:zbus"]
tui = ["dep:crossterm", "dep:ratatui"]

[[bin]]
name = "peerlume"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "peerlume-tui"
path = "src/bin/peerlume-tui.rs"
required-features = ["tui"]

[dependencies]
anyhow = "1.0.104"
cap-std = "=4.0.3"
cap-fs-ext = "=4.0.3"
crc32fast = "1.5.2"
crossterm = { version = "0.29.0", optional = true }
eframe = { version = "0.33.3", default-features = false, features = ["default_fonts", "glow", "x11"], optional = true }
flate2 = "1.1.10"
getrandom = "0.4.3"
librqbit = { version = "9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-tracker-comms = "9.0.1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rfd = { version = "0.15", optional = true }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"], optional = true }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "net", "time", "sync", "io-util", "macros"] }
toml = "1.1.6"
trash = "5.2.9"
url = "2.5.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_IO", "Win32_System_Ioctl", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_Shell_Common"] }

[dev-dependencies]
tempfile = "3.27.0"
proptest = "1.11.0"
testcontainers = { version = "0.28.0", features = ["blocking"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "=3.6.3", default-features = false, features = ["async-secret-service", "async-io", "crypto-rust"] }
zbus = { version = "=5.19.0", optional = true }

[profile.dev]
debug = 0

[profile.test]
debug = 0

[patch.crates-io]
librqbit-tracker-comms = { path = "vendor/librqbit-tracker-comms" }
