name: Realistic swarm soak
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Minimum continuous engine workload seconds (120 to 14400)'
        default: '14400'
        required: true
      profile:
        description: 'Small smoke fixtures or two approximately 2 GiB downloads'
        type: choice
        options: [smoke, large]
        default: large
        required: true
permissions:
  contents: read
concurrency:
  group: realistic-swarm-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  swarm:
    name: One engine, streamed files, peer churn and tracker faults
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install stable --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-continuous-session-${{ hashFiles('Cargo.lock','**/Cargo.toml') }}
      - name: Run the complete experiment once
        env:
          PEERLUME_SWARM_SECONDS: ${{ inputs.seconds }}
          PEERLUME_SWARM_PROFILE: ${{ inputs.profile }}
        run: |
          [[ "$PEERLUME_SWARM_SECONDS" =~ ^[0-9]+$ ]] && (( PEERLUME_SWARM_SECONDS >= 120 && PEERLUME_SWARM_SECONDS <= 14400 )) || exit 2
          [[ "$PEERLUME_SWARM_PROFILE" = smoke || "$PEERLUME_SWARM_PROFILE" = large ]] || exit 2
          if [ "$PEERLUME_SWARM_PROFILE" = large ]; then
            available=$(df --output=avail -B1 . | tail -1)
            (( available >= 8 * 1024 * 1024 * 1024 )) || { echo 'At least 8 GiB free disk space is required'; exit 2; }
          fi
          mkdir -p swarm-results
          export PEERLUME_SWARM_REPORT="$PWD/swarm-results/resources.jsonl"
          cargo +stable test --locked --no-default-features --lib reliability_realistic_swarm_soak -- --ignored --test-threads=1 --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: realistic-swarm-soak
          path: swarm-results/
          if-no-files-found: warn
          retention-days: 14
