name: Build packages

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
    paths:
      - '.github/workflows/builds.yml'
      - 'scripts/package_build.py'
      - 'scripts/test_package_build.py'
      - 'scripts/verify_build.py'
      - 'docs/distribution.md'

permissions:
  contents: read

concurrency:
  group: packages-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  package:
    name: Release package (${{ matrix.platform }}, ${{ matrix.flavor }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            flavor: desktop
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            flavor: desktop
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
          - platform: windows-x64
            flavor: tui
            os: windows-2025
            target: x86_64-pc-windows-msvc
          - platform: linux-x64
            flavor: tui
            os: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install Linux GUI build and runtime libraries
        if: runner.os == 'Linux' && matrix.flavor == 'desktop'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config libegl1-mesa-dev libgl1-mesa-dri libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libxi-dev libxrandr-dev
      - name: Install Rust and record the compiler
        id: rust
        env:
          BUILD_TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install stable --profile minimal --target $env:BUILD_TARGET
          if ($LASTEXITCODE -ne 0) { throw 'Rust installation failed' }
          "version=$(rustc +stable --version)" >> $env:GITHUB_OUTPUT
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-packages-${{ matrix.target }}-${{ matrix.flavor }}-${{ steps.rust.outputs.version }}-${{ hashFiles('Cargo.lock', '**/Cargo.toml', '.github/workflows/builds.yml') }}
      - name: Test the archive contract and safety checks
        run: python -m unittest discover -s scripts -p test_package_build.py -v
      - name: Reject GUI dependencies in the headless package
        if: matrix.flavor == 'tui'
        run: python scripts/check_headless_dependencies.py
      - name: Test both frontends and tracker reporting before packaging
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          $features = if ($env:BUILD_FLAVOR -eq 'tui') { @('--no-default-features', '--features', 'tui') } else { @('--all-features') }
          cargo +stable test --locked @features --target $env:BUILD_TARGET --lib -p peerlume -p librqbit-tracker-comms
          if ($LASTEXITCODE -ne 0) { throw 'Library tests failed' }
          cargo +stable test --locked @features --target $env:BUILD_TARGET --test core_workflows
          if ($LASTEXITCODE -ne 0) { throw 'Core workflow tests failed' }
      - name: Build release GUI, TUI, CLI and MCP adapter
        env:
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          $features = if ($env:BUILD_FLAVOR -eq 'tui') { @('--no-default-features', '--features', 'tui') } else { @('--all-features', '--bin', 'peerlume') }
          cargo +stable build --release --locked @features --target $env:BUILD_TARGET --bin peerlume-tui --bin peerlume-control --bin peerlume-mcp
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed' }
      - name: Verify the embedded Windows application icon
        if: runner.os == 'Windows' && matrix.flavor == 'desktop'
        run: ./scripts/check-app-icon.ps1 -BinaryPath target/x86_64-pc-windows-msvc/release/peerlume.exe
      - name: Create an allowlisted archive and SHA-256 files
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_TARGET: ${{ matrix.target }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUST: ${{ steps.rust.outputs.version }}
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          python scripts/package_build.py --flavor $env:BUILD_FLAVOR --platform $env:BUILD_PLATFORM --binary-directory "target/$env:BUILD_TARGET/release" --commit $env:BUILD_SHA --rust-version $env:BUILD_RUST
          if ($LASTEXITCODE -ne 0) { throw 'Packaging failed' }
      - name: Extract and verify the downloadable package
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_FLAVOR: ${{ matrix.flavor }}
        run: |
          python scripts/verify_build.py --flavor $env:BUILD_FLAVOR --platform $env:BUILD_PLATFORM --commit $env:BUILD_SHA
          if ($LASTEXITCODE -ne 0) { throw 'Packaged build verification failed' }
      - name: Upload the verified package and checksum
        id: artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: peerlume-${{ matrix.flavor }}-${{ matrix.platform }}-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: dist/builds/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - name: Add download instructions to the run summary
        env:
          BUILD_PLATFORM: ${{ matrix.platform }}
          ARTIFACT_URL: ${{ steps.artifact.outputs.artifact-url }}
        run: |
          "## $env:BUILD_PLATFORM release build" >> $env:GITHUB_STEP_SUMMARY
          "[Download archive and SHA-256 checksum]($env:ARTIFACT_URL)" >> $env:GITHUB_STEP_SUMMARY
          "Commit: $env:GITHUB_SHA. Unsigned build; profiles and credentials are not included." >> $env:GITHUB_STEP_SUMMARY
