name: Continuous session soak
on:
  workflow_dispatch:
    inputs:
      seconds:
        description: 'Continuous workload seconds, from 60 to 14400 (four hours)'
        default: '14400'
        required: true
      mode:
        description: 'Reporting mode retained through every repair'
        type: choice
        options: [normal, no_progress]
        default: normal
permissions:
  contents: read
concurrency:
  group: continuous-session-${{ github.run_id }}
  cancel-in-progress: false
jobs:
  session:
    name: One persistent engine with download, seeding and repair
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.93.0 --profile minimal
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-continuous-session-${{ hashFiles('Cargo.lock','**/Cargo.toml') }}
      - name: Run the complete experiment once
        env:
          REQUESTED_SECONDS: ${{ inputs.seconds }}
          SELECTED_MODE: ${{ inputs.mode }}
        run: |
          [[ "$REQUESTED_SECONDS" =~ ^[0-9]+$ ]] && (( REQUESTED_SECONDS >= 60 && REQUESTED_SECONDS <= 14400 )) || exit 2
          [[ "$SELECTED_MODE" = normal || "$SELECTED_MODE" = no_progress ]] || exit 2
          mkdir -p continuous-results
          export PEERLUME_SOAK_SECONDS="$REQUESTED_SECONDS"
          export PEERLUME_SOAK_MODE="$SELECTED_MODE"
          export PEERLUME_SOAK_REPORT="$PWD/continuous-results/resources.jsonl"
          cargo +1.93.0 test --locked --no-default-features --lib reliability_continuous_session_soak -- --ignored --test-threads=1 --nocapture
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: continuous-session-soak
          path: continuous-results/
          if-no-files-found: warn
          retention-days: 14
