[package]
name = "peerlume-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
peerlume = { path = "..", default-features = false }

[patch.crates-io]
librqbit = { path = "../vendor/librqbit" }
librqbit-tracker-comms = { path = "../vendor/librqbit-tracker-comms" }

[[bin]]
name = "metainfo"
path = "fuzz_targets/metainfo.rs"
test = false
doc = false

[[bin]]
name = "blocklist"
path = "fuzz_targets/blocklist.rs"
test = false
doc = false

[[bin]]
name = "wire"
path = "fuzz_targets/wire.rs"
test = false
doc = false

[[bin]]
name = "peer"
path = "fuzz_targets/peer.rs"
test = false
doc = false

[[bin]]
name = "tracker"
path = "fuzz_targets/tracker.rs"
test = false
doc = false
